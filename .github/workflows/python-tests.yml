
name: Python tests (pytest)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run pytest inside CI_CD_test
        run: |
          cd CI_CD_test
          pip install -r requirements.txt
          PYTHONPATH=src pytest -q

      - name: Create a file
        run: |
          echo "This file is created by GitHub Actions" > output.txt


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-first-artifact
          path: output.txt
  
