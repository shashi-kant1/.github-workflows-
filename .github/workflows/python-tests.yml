
name: Python tests (pytest)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install pytest and html plugin
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html

      - name: Run tests and generate HTML report
        run: |
          cd CI_CD_test
          pip install -r requirements.txt
          PYTHONPATH=src pytest --html=pytest-report.html --self-contained-html

      - name: Create a file
        run: |
          echo "This file is created by GitHub Actions" > output.txt


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-first-artifact
          path: CI_CD_test/pytest-report.html
  
