
name: Hello World CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Say Hello
      run: |
        echo "Hello from GitHub Actions!"
        echo "Current branch: ${{ github.ref }}"
        echo "Actor: ${{ github.actor }}"
